name: CD Staging Pipeline

on:
  push:
    branches:
      - develop

jobs:
  deploy-staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Types & Projects
        run: npm run build

      - name: Run Tests
        run: npm run test

      - name: Deploy Notification
        run: echo "Successfully validated build and prepared Staging Deployment package."
