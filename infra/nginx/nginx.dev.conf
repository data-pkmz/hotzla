# FOR LOCAL DEVELOPMENT ONLY

events {
    worker_connections 1024;
}

http {
    access_log off;
    error_log /dev/stderr warn;

    resolver 127.0.0.11 ipv6=off valid=30s;

    server {
        listen 8080;
        server_name localhost;

        # Allow upload of files up to 25MB (application maximum is 20MB)
        client_max_body_size 25M;

        location / {
            set $frontend_upstream host.docker.internal:5173;

            proxy_http_version 1.1;
            proxy_set_header Host $host;

            proxy_pass http://$frontend_upstream;
        }

        location /api/ {
            set $backend_upstream host.docker.internal:3001;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";

            proxy_set_header X-Remote-User "Iwa_User";

            set $mock_user $http_x_mock_user;

            if ($mock_user = "") {
                set $mock_user "requester";
            }

            proxy_set_header X-Mock-User $mock_user;

            proxy_pass http://$backend_upstream;
        }
    }
}