# FOR LOCAL DEVELOPMENT ONLY

events {
    worker_connections  1024; # Maximum simultaneous connections per worker
}

http {
    # Development Server Block
    server {
        listen       8080;        # Local port to access your app (e.g., localhost:8080)
        server_name  localhost;   # Domain name for this block

        # 1. Serve static frontend files (HTML, JS, CSS)
        location / {
            proxy_pass http://localhost:5173;            
            proxy_set_header Host $host;
        }

        # 2. Reverse Proxy to a local backend API (e.g., Node.js running on port 3001)
        location /api/ {
            proxy_set_header Host $host;
            proxy_set_header X-Remote-User "dev_requester";

            set $mock_user $http_x_mock_user;
            if ($mock_user = "") {
                set $mock_user "dev-requester"; # Fallback if header is missing
            }
            proxy_set_header X-Mock-User $mock_user;
            proxy_pass http://localhost:3001/;
        }
    }
}
