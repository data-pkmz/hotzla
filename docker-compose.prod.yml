services:
  nginx:
    image: nginx:alpine
    container_name: hotzla-nginx-prod
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    restart: always

  postgres:
    image: postgres:15-alpine
    container_name: hotzla-postgres-prod
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_prod_data:
