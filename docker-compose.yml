version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: hotzla-postgres
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: hotzla_user
      POSTGRES_PASSWORD: hotzla_password
      POSTGRES_DB: hotzla_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
