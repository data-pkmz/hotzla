<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>אישור קבלת הזמנה</title>
  </head>

  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
      font-family: Arial, sans-serif;
      direction: rtl;
      text-align: right;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      border="0"
      style="background-color: #f5f5f5; padding: 24px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            border="0"
            style="max-width: 600px; background-color: #ffffff; border-radius: 8px; padding: 32px"
          >
            <tr>
              <td style="font-size: 22px; font-weight: bold; padding-bottom: 24px">
                הזמנתך התקבלה בהצלחה
              </td>
            </tr>

            <tr>
              <td style="font-size: 16px; line-height: 1.6; padding-bottom: 16px">
                הזמנה מספר <strong>{{orderNumber}}</strong> התקבלה במערכת.
              </td>
            </tr>

            <tr>
              <td style="font-size: 16px; line-height: 1.6; padding-bottom: 24px">
                ניתן לעקוב אחר סטטוס ההזמנה דרך עמוד ההזמנות שלך.
              </td>
            </tr>

            <tr>
              <td align="center">
                <a
                  href="{{trackingUrl}}"
                  style="
                    display: inline-block;
                    padding: 12px 24px;
                    background-color: #243b7a;
                    color: #ffffff;
                    text-decoration: none;
                    border-radius: 6px;
                    font-size: 16px;
                    font-weight: bold;
                  "
                >
                  מעקב אחר ההזמנה
                </a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
